<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PartyQuest · Pachi</title>
    <script>
      // Apply the saved appearance before first paint; the conversation is not persisted.
      (function () {
        var preference = null;
        try { preference = localStorage.getItem("partyquest.theme"); } catch {}
        var dark = preference === "dark" || (preference !== "light" &&
          typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
